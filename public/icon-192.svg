<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- Background -->
  <rect width="192" height="192" rx="36" fill="#0f1510"/>

  <!-- Telescope at -45 degrees, centered -->
  <g transform="translate(96,96) rotate(-45)">

    <!-- Main barrel (widest) -->
    <rect x="-58" y="-10" width="88" height="20" rx="4" fill="#eee9de"/>

    <!-- Middle extension -->
    <rect x="31" y="-7" width="34" height="14" rx="3" fill="#ddd8cc"/>

    <!-- Eyepiece -->
    <rect x="62" y="-5" width="22" height="10" rx="3" fill="#ccc8bc"/>

    <!-- Eyepiece tip -->
    <rect x="81" y="-3" width="7" height="6" rx="2" fill="#b8b4a8"/>

    <!-- Ring 1 -->
    <rect x="28" y="-11" width="5" height="22" rx="2" fill="#b4b0a4"/>

    <!-- Ring 2 -->
    <rect x="59" y="-8" width="4" height="16" rx="2" fill="#b4b0a4"/>

    <!-- Objective lens housing -->
    <circle cx="-58" cy="0" r="16" fill="#0f1510"/>

    <!-- Lens glass -->
    <circle cx="-58" cy="0" r="13" fill="#6a9e98" opacity="0.9"/>
    <circle cx="-58" cy="0" r="8" fill="#4a7c59" opacity="0.75"/>

    <!-- Lens glint -->
    <circle cx="-54" cy="-4" r="4" fill="white" opacity="0.18"/>

    <!-- Lens outer ring -->
    <circle cx="-58" cy="0" r="16" fill="none" stroke="#6B9B7F" stroke-width="2.5"/>

  </g>
</svg>
